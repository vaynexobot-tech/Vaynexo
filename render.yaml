# Render Blueprint: Dashboard → New → Blueprint → shu repo va branch.
# Bepul tarif: sinov uchun (15 daqiqa harakatsizlikda uxlaydi, bepul baza ~30 kun).
databases:
  - name: vaynexo-db
    plan: free
    databaseName: vaynexo
    user: vaynexo

services:
  - type: web
    name: vaynexo
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vaynexo-db
          property: connectionString
      # Quyidagilarni yaratishda Render so'raydi:
      - key: BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY  # AI bo'limi; bo'sh bo'lsa AI o'chiq
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: P2P_CARD_NUMBER
        sync: false
      - key: P2P_CARD_HOLDER
        sync: false
      # Avtomatik yaratiladi:
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: P2P_SECRET
        generateValue: true
      - key: BOT_WEBHOOK_SECRET
        generateValue: true
      - key: REDIS_URL
        value: ""
      - key: DONATE_PROVIDER
        value: mock
      - key: DEV_MODE
        value: "false"
